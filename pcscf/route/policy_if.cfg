######################################################################
# Policy interface (Rx vs N5) selection for LTE/NR IMS coexistence
#
# Decides which policy interface serves the UE identified by
# $var(policy_ue_ip) and caches the verdict in $avp(policy_if)
# ("Rx" or "N5") for the rest of the transaction. Callers must set
# $var(policy_ue_ip) before invoking route(POLICY_IF_SELECT).
#
# Layered decision (first verdict wins):
#   1. BSF PCF-binding lookup (Nbsf_management_Discovery) - the core's
#      authoritative view of how the UE's PDU session is anchored:
#        200 -> 5G-anchored session -> N5
#        404 -> no 5G binding (LTE, VoWiFi via ePDG, plain VoIP) -> Rx
#   2. P-Access-Network-Info of the current message (stateless)
#   3. Registration-time RAT cache (vonrclients et al. htables),
#      best-effort only - may be stale after a P-CSCF restart
#   4. Default: Rx
#
# Compile-time behaviour:
#   - WITH_RX only:  static "Rx" (upstream's unconditional-Rx flow)
#   - WITH_N5 (with or without WITH_RX): full dynamic selection, so
#     that non-5G clients (VoLTE, VoWiFi, VoIP) never trigger N5
######################################################################

route[POLICY_IF_SELECT] {
	# Already decided for this transaction.
	if ($avp(policy_if) != $null) {
		return;
	}

#!ifdef WITH_N5
	# Layer 1: BSF PCF-binding discovery.
	route(POLICY_IF_BSF);
	if ($avp(policy_if) != $null) {
		xlog("L_INFO", "POLICY_IF: $avp(policy_if) for $var(policy_ue_ip) (BSF binding)\n");
		return;
	}

	# Layer 2: P-Access-Network-Info of the current message.
	if (is_present_hf("P-Access-Network-Info")) {
		if ($hdr(P-Access-Network-Info) =~ ".*3GPP-NR.*") {
			$avp(policy_if) = "N5";
		} else {
			# 3GPP-E-UTRAN* (VoLTE) and IEEE-802.11 (VoWiFi via
			# ePDG) sessions are EPC-anchored and use Rx.
			$avp(policy_if) = "Rx";
		}
		xlog("L_INFO", "POLICY_IF: $avp(policy_if) for $var(policy_ue_ip) (PANI)\n");
		return;
	}

	# Layer 3: registration-time RAT cache.
	if ($sht(vonrclients=>$var(policy_ue_ip)) != $null) {
		$avp(policy_if) = "N5";
		xlog("L_INFO", "POLICY_IF: N5 for $var(policy_ue_ip) (cache)\n");
		return;
	}
	if ($sht(volteclients=>$var(policy_ue_ip)) != $null
			|| $sht(vowificlients=>$var(policy_ue_ip)) != $null
			|| $sht(voipclients=>$var(policy_ue_ip)) != $null) {
		$avp(policy_if) = "Rx";
		xlog("L_INFO", "POLICY_IF: Rx for $var(policy_ue_ip) (cache)\n");
		return;
	}

	# Layer 4: default.
	$avp(policy_if) = "Rx";
	xlog("L_WARN", "POLICY_IF: defaulting to Rx for $var(policy_ue_ip) (no BSF/PANI/cache verdict)\n");
#!endif
#!ifndef WITH_N5
#!ifdef WITH_RX
	$avp(policy_if) = "Rx";
#!endif
#!endif
}

#!ifdef WITH_N5
# Query the BSF for a PCF binding on the UE IP. The BSF only holds a
# binding while the PCF anchors a 5G PDU session for that address, so
# existence of the binding is the N5-vs-Rx answer.
route[POLICY_IF_BSF] {
	$var(bsf_headers) = "Accept: application/json\r\n";
	$var(bsf_result) = "";
	http_client_request_v2pk("GET", "http://BSF_BIND_IP:BSF_BIND_PORT/nbsf-management/v1/pcfBindings?ipv4Addr=$var(policy_ue_ip)", "", "$var(bsf_headers)", "$var(bsf_result)");
	if ($rc == 200) {
		$avp(policy_if) = "N5";
	} else if ($rc == 404) {
		$avp(policy_if) = "Rx";
	} else {
		xlog("L_WARN", "POLICY_IF: BSF query failed (rc: $rc) for $var(policy_ue_ip); using fallbacks\n");
	}
}
#!endif
