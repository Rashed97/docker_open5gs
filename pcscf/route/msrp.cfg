######################################################################
# MSRP relay (RFC 4975/4976) for RCS session-mode messaging
#
# Chat/file-transfer sessions are negotiated over SIP (INVITE with
# "m=message ... TCP/MSRP" SDP); the MSRP frames themselves arrive on
# the dedicated TCP listener and are handled here. Clients that place
# this relay in their path first send an AUTH request and get a
# Use-Path back (tracked in the module's connection map); SEND/REPORT
# frames are then delivered to the mapped peer connection, or relayed
# along the To-Path for destinations not connected here.
#
# Lab scope: AUTH is accepted without MSRP-level digest credentials.
######################################################################

#!ifdef WITH_MSRP
event_route[msrp:frame-in] {
	xlog("L_INFO", "MSRP: $msrp(method) frame from $msrp(srcaddr) sessid=$msrp(sessid)\n");

	if (msrp_is_reply()) {
		msrp_relay();
		exit;
	}

	if ($msrp(method) == "AUTH") {
		# Lab relay: accept any client and hand out a Use-Path via
		# the connection map (no MSRP-level digest auth yet).
		if (msrp_cmap_save()) {
			msrp_reply("200", "OK");
		} else {
			xlog("L_ERR", "MSRP: failed to save AUTH session in cmap\n");
			msrp_reply("500", "Server Error");
		}
		exit;
	}

	if ($msrp(method) == "SEND" || $msrp(method) == "REPORT") {
		# Deliver to a connected peer if the destination session is
		# in the connection map, otherwise forward along the To-Path.
		if (!msrp_cmap_lookup()) {
			xlog("L_INFO", "MSRP: destination not in cmap, relaying by To-Path\n");
		}
		msrp_relay();
		exit;
	}

	msrp_reply("501", "Request-method-not-understood");
}
#!endif
